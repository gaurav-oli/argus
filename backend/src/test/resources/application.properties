# Test-only overrides. This layers on top of src/main/resources/application.yml (different filename,
# so it does NOT shadow it) and wins per-key. Keep it minimal.
#
# Hermeticity: disable the live external news sources so the @Scheduled ingest cycle never makes
# outbound HTTP from a test JVM (Finnhub is already key-gated off; this covers GDELT + RSS).
argus.news.gdelt.enabled=false
argus.news.rss.enabled=false
argus.calendar.fed-enabled=false
# Never seed sample intelligence data during tests (it would pollute count assertions).
argus.dev.seed=false

# Agent 15 (academic strategies): never fetch the corpus/universe or backfill the ranking universe's
# candles from a test JVM — it would hit live GitHub/Yahoo and race real inserts against test fixtures
# in the shared Testcontainers DB (exactly what caused a price_candles unique-constraint collision).
argus.strategy.enabled=false

# Agents 5 and 7 catch up on a missed run at startup; never in a test JVM, where that run would race
# test fixtures in the shared Testcontainers DB.
argus.boot-catch-up.enabled=false

# Never poll live Yahoo quotes from a test JVM.
argus.live-quotes.enabled=false

# The freshness watcher never pushes alerts from a test JVM.
argus.freshness.alerts-enabled=false
